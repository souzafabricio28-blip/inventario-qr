{% extends "base.html" %}
{% block title %}Configurações - Inventário QR{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-xl shadow-md p-6">
    <h2 class="text-2xl font-bold mb-4"><i class="fas fa-cog text-gray-700"></i> Configurações</h2>
    <div class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Sessão Padrão ao Iniciar</label>
            <select id="cfg_sessao" class="w-full border rounded-lg px-3 py-2"></select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Som ao Escanear</label>
            <select id="cfg_som" class="w-full border rounded-lg px-3 py-2">
                <option value="1">Ativado</option>
                <option value="0">Desativado</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Notificação de Vencido</label>
            <select id="cfg_notif" class="w-full border rounded-lg px-3 py-2">
                <option value="1">Ativado</option>
                <option value="0">Desativado</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tema</label>
            <select id="cfg_tema" class="w-full border rounded-lg px-3 py-2">
                <option value="claro">Claro</option>
                <option value="escuro">Escuro</option>
            </select>
        </div>
        <button onclick="salvarConfig()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 w-full font-bold">
            <i class="fas fa-save"></i> Salvar Configurações
        </button>
        <div id="resultado_config" class="mt-2"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    async function carregarConfig() {
        const [r1, r2] = await Promise.all([
            fetch('/api/config'),
            fetch('/api/sessoes')
        ]);
        const config = await r1.json();
        const sessoes = await r2.json();

        const sel = document.getElementById('cfg_sessao');
        sel.innerHTML = '<option value="">Nenhuma (perguntar sempre)</option>' +
            sessoes.map(s => `<option value="${s.nome}">${s.nome}</option>`).join('');
        sel.value = config.sessao_padrao || '';

        document.getElementById('cfg_som').value = config.som_scan || '1';
        document.getElementById('cfg_notif').value = config.notif_vencido || '1';
        document.getElementById('cfg_tema').value = config.tema || 'claro';
    }

    async function salvarConfig() {
        const data = {
            sessao_padrao: document.getElementById('cfg_sessao').value,
            som_scan: document.getElementById('cfg_som').value,
            notif_vencido: document.getElementById('cfg_notif').value,
            tema: document.getElementById('cfg_tema').value,
        };
        const r = await fetch('/api/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data),
        });
        const res = await r.json();
        const div = document.getElementById('resultado_config');
        div.innerHTML = `<div class="bg-green-100 border border-green-300 rounded-lg p-3 text-sm">${res.msg}</div>`;
        setTimeout(() => div.innerHTML = '', 3000);

        if (data.tema === 'escuro') {
            document.body.classList.add('bg-gray-900', 'text-white');
        } else {
            document.body.classList.remove('bg-gray-900', 'text-white');
        }
        localStorage.setItem('tema', data.tema);
    }

    carregarConfig();
</script>
{% endblock %}
