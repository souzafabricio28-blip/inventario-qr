{% extends "base.html" %}
{% block title %}Estoque Atual - Inventário QR{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-xl shadow-md p-6 mb-4">
        <h2 class="text-xl font-bold mb-3"><i class="fas fa-warehouse text-indigo-600"></i> Estoque Atual</h2>

        <div class="flex flex-wrap gap-2 mb-4">
            <select id="select_loja" class="border rounded-lg px-3 py-2 text-sm font-semibold" onchange="trocarLoja(this.value)">
                <option value="">Carregando lojas…</option>
            </select>
            <input type="text" id="busca-estoque" placeholder="Buscar por EAN ou produto..."
                   class="flex-1 min-w-[12rem] border rounded-lg px-4 py-2">
            <button onclick="buscarEstoque()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg"><i class="fas fa-search"></i></button>
            <button onclick="mostrarZerados()" class="bg-gray-200 text-gray-600 px-3 py-2 rounded-lg text-sm font-medium">Zerados</button>
            <button type="button" onclick="zerarEstoque()"
                    class="bg-rose-700 text-white px-3 py-2 rounded-lg text-sm font-semibold hover:bg-rose-800"
                    title="Coloca quantidade de todos os produtos em 0">
                <i class="fas fa-eraser"></i> Zerar estoque
            </button>
        </div>

        <div id="loja-frase" class="text-sm text-gray-500 mb-3"></div>

        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-gray-50 text-gray-500 uppercase text-xs">
                        <th class="text-left p-2">EAN</th>
                        <th class="text-left p-2">Produto</th>
                        <th class="text-center p-2">Loja Física</th>
                        <th class="text-center p-2">Depósito</th>
                        <th class="text-center p-2">Total</th>
                        <th class="text-center p-2">Lote</th>
                        <th class="text-center p-2">Validade</th>
                        <th class="text-center p-2">Mover</th>
                    </tr>
                </thead>
                <tbody id="estoque-body"></tbody>
            </table>
        </div>
        <div id="estoque-vazio" class="hidden text-center text-gray-400 py-8">
            <i class="fas fa-box-open text-4xl mb-2"></i>
            <p>Nenhum produto em estoque</p>
        </div>
    </div>

    <div id="zerados-section" class="hidden bg-white rounded-xl shadow-md p-4 mb-4">
        <h3 class="font-bold text-sm mb-2 text-gray-500">Produtos sem estoque (zerados)</h3>
        <div id="zerados-body" class="text-sm space-y-1 max-h-40 overflow-y-auto"></div>
    </div>

    <div class="bg-white rounded-xl shadow-md p-4">
        <h3 class="font-bold text-sm mb-2"><i class="fas fa-chart-pie text-gray-500"></i> Resumo</h3>
        <div id="resumo-estoque" class="grid grid-cols-3 gap-3 text-center"></div>
    </div>
</div>

<script>
    let lojaEstoque = localStorage.getItem('loja_atual') || 'RTJ';

    async function carregarLojas() {
        const sel = document.getElementById('select_loja');
        try {
            const r = await fetch('/api/lojas', { cache: 'no-store' });
            const lojas = await r.json();
            if (!Array.isArray(lojas) || !lojas.length) return;
            sel.innerHTML = lojas.map(l =>
                `<option value="${l.codigo}">${l.codigo} — ${l.nome}</option>`
            ).join('');
            if (lojas.some(l => l.codigo === lojaEstoque)) sel.value = lojaEstoque;
            else lojaEstoque = sel.value;
        } catch (e) {
            sel.innerHTML = '<option value="RTJ">RTJ</option><option value="RTB">RTB</option>';
        }
        atualizarFraseLoja();
    }

    function trocarLoja(codigo) {
        lojaEstoque = codigo || 'RTJ';
        localStorage.setItem('loja_atual', lojaEstoque);
        atualizarFraseLoja();
        document.getElementById('zerados-section').classList.add('hidden');
        buscarEstoque();
    }

    function atualizarFraseLoja() {
        document.getElementById('loja-frase').textContent =
            'Loja ' + lojaEstoque + ' (RTJ = Rio Tinto, RTB = Rio do Bastos) — Loja Física é o que está no balcão/prateleira; Depósito é o estoque recebido (NF-e). Total = física + depósito.';
    }

    async function buscarEstoque() {
        const q = document.getElementById('busca-estoque').value.trim();
        const loja = encodeURIComponent(lojaEstoque);
        const url = q
            ? `/api/estoque?search=${encodeURIComponent(q)}&loja=${loja}`
            : `/api/estoque?loja=${loja}`;
        const r = await fetch(url);
        const dados = await r.json();
        const tbody = document.getElementById('estoque-body');
        const vazio = document.getElementById('estoque-vazio');
        const lista = Array.isArray(dados) ? dados : [];

        if (lista.length === 0) {
            tbody.innerHTML = '';
            vazio.classList.remove('hidden');
        } else {
            vazio.classList.add('hidden');
            tbody.innerHTML = lista.map(p => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-2 font-mono text-xs">${p.ean}</td>
                    <td class="p-2 font-medium">${p.produto || ''}</td>
                    <td class="p-2 text-center font-bold ${p.quantidade_loja > 0 ? 'text-emerald-600' : 'text-gray-300'}">${p.quantidade_loja || 0}</td>
                    <td class="p-2 text-center font-bold ${p.quantidade_estoque > 0 ? 'text-sky-600' : 'text-gray-300'}">${p.quantidade_estoque || 0}</td>
                    <td class="p-2 text-center font-bold ${p.total > 0 ? 'text-indigo-600' : 'text-red-500'}">${p.total || 0}</td>
                    <td class="p-2 text-center text-xs ${p.lote ? 'text-gray-600' : 'text-gray-300'}">${p.lote || '-'}</td>
                    <td class="p-2 text-center text-xs ${p.data_vencimento ? 'text-gray-600' : 'text-gray-300'}">${formatarData(p.data_vencimento) || '-'}</td>
                    <td class="p-2 text-center">
                        <button onclick="moverEstoque('${p.ean}')" title="Mover entre depósito e loja física"
                                class="text-indigo-500 hover:text-indigo-700 text-sm">
                            <i class="fas fa-right-left"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        const total = lista.reduce((s, p) => s + Number(p.total || 0), 0);
        const comEstoque = lista.filter(p => Number(p.total || 0) > 0).length;
        document.getElementById('resumo-estoque').innerHTML = `
            <div class="bg-indigo-50 rounded-lg p-3">
                <p class="text-2xl font-bold text-indigo-600">${total}</p>
                <p class="text-xs text-gray-500">Total unidades (${lojaEstoque})</p>
            </div>
            <div class="bg-emerald-50 rounded-lg p-3">
                <p class="text-2xl font-bold text-emerald-600">${comEstoque}</p>
                <p class="text-xs text-gray-500">Produtos em estoque</p>
            </div>
            <div class="bg-yellow-50 rounded-lg p-3">
                <p class="text-2xl font-bold text-yellow-600">${comEstoque > 0 ? (total / comEstoque).toFixed(1) : '0'}</p>
                <p class="text-xs text-gray-500">Média por item</p>
            </div>
        `;
    }

    async function moverEstoque(ean) {
        const entrada = prompt(
            'EAN ' + ean + ' — mover entre depósito e loja física (' + lojaEstoque + '):\n\n' +
            'Digite um número POSITIVO para mover do DEPÓSITO para a LOJA FÍSICA.\n' +
            'Digite um número NEGATIVO para mover da LOJA FÍSICA para o DEPÓSITO.\n\n' +
            'Ex.: 5  (depósito -> loja física)\nEx.: -3 (loja física -> depósito)'
        );
        if (entrada === null) return;
        const quantidade = Number(String(entrada).trim());
        if (!entrada.trim() || isNaN(quantidade) || quantidade === 0) {
            alert('Informe uma quantidade válida (ex.: 5 ou -3).');
            return;
        }
        try {
            const r = await fetch('/api/estoque/mover', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ean: ean, loja: lojaEstoque, quantidade: quantidade }),
            });
            const data = await r.json();
            alert(data.msg || (data.sucesso ? 'OK' : 'Erro'));
            if (data.sucesso) await buscarEstoque();
        } catch (e) {
            alert('Falha ao mover estoque: ' + e);
        }
    }

    async function mostrarZerados() {
        const section = document.getElementById('zerados-section');
        if (!section.classList.contains('hidden')) {
            section.classList.add('hidden');
            return;
        }
        section.classList.remove('hidden');
        const r = await fetch(`/api/estoque/zerados?loja=${encodeURIComponent(lojaEstoque)}`);
        const dados = await r.json();
        document.getElementById('zerados-body').innerHTML = dados.length === 0
            ? '<p class="text-gray-400 text-center">Nenhum produto zerado</p>'
            : dados.map(p => `
                <div class="flex justify-between items-center p-1 border-b text-xs">
                    <span class="font-mono">${p.ean}</span>
                    <span class="flex-1 ml-2">${p.produto || ''}</span>
                    <span class="text-red-500 font-bold">${p.total || 0}</span>
                </div>
            `).join('');
    }

    async function zerarEstoque() {
        if (!confirm(
            'ZERAR o estoque da loja ' + lojaEstoque + '?\n\n' +
            'Todas as quantidades desta loja passam a 0.\n' +
            'O estoque das OUTRAS lojas não é alterado.\n' +
            'Contagens de inventário NÃO são apagadas.'
        )) return;
        const limparLote = confirm(
            'Também limpar lote e validade?\n\n' +
            'OK = sim\nCancelar = só zerar quantidade'
        );
        try {
            const r = await fetch('/api/estoque/zerar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ limpar_lote: limparLote, loja: lojaEstoque }),
            });
            const data = await r.json();
            alert(data.msg || (data.sucesso ? 'OK' : 'Erro'));
            if (data.sucesso) {
                document.getElementById('zerados-section').classList.add('hidden');
                await buscarEstoque();
            }
        } catch (e) {
            alert('Falha ao zerar estoque: ' + e);
        }
    }

    document.getElementById('busca-estoque').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') buscarEstoque();
    });

    carregarLojas();
    buscarEstoque();
</script>
{% endblock %}
