<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4338ca">
    <title>Login - Inventário QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
        .login-bg {
            min-height: 100vh;
            background:
                radial-gradient(1000px 600px at 85% -10%, rgba(129, 140, 248, 0.45), transparent 55%),
                radial-gradient(900px 500px at -10% 110%, rgba(34, 211, 238, 0.28), transparent 55%),
                linear-gradient(135deg, #0f172a 0%, #1e1b4b 55%, #312e81 100%);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 1.5rem;
            box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.55);
        }
        .logo-mark {
            width: 3.5rem; height: 3.5rem; border-radius: 1rem;
            background: linear-gradient(135deg, #818cf8, #22d3ee);
            display: inline-flex; align-items: center; justify-content: center;
            color: #fff; box-shadow: 0 10px 24px -6px rgba(129, 140, 248, 0.7);
        }
        .field:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18); }
        .btn-login {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
            box-shadow: 0 10px 22px -8px rgba(79, 70, 229, 0.6);
        }
        .btn-login:hover { filter: brightness(1.06); }
        .btn-login:active { transform: translateY(1px) scale(.99); }
    </style>
</head>
<body class="login-bg">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="login-card p-8 w-full max-w-md">
            <div class="text-center mb-8">
                <div class="inline-flex logo-mark mb-4">
                    <i class="fas fa-boxes text-2xl"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Inventário QR</h1>
                <p class="text-gray-500 text-sm mt-1.5">Controle de inventário por loja, simples e rápido</p>
            </div>

            {% if erro %}
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-4 text-sm flex items-center gap-2">
                <i class="fas fa-exclamation-circle"></i>{{ erro }}
            </div>
            {% endif %}

            <form method="POST" action="/login" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Usuário</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" name="usuario" required autofocus
                               class="field w-full pl-11 pr-4 py-3 border border-gray-200 rounded-xl bg-gray-50 text-gray-900 placeholder-gray-400"
                               placeholder="Digite seu usuário">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">Senha</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" name="senha" required
                               class="field w-full pl-11 pr-4 py-3 border border-gray-200 rounded-xl bg-gray-50 text-gray-900 placeholder-gray-400"
                               placeholder="Digite sua senha">
                    </div>
                </div>

                <button type="submit"
                        class="btn-login w-full text-white font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 text-sm">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Entrar</span>
                </button>
            </form>

            <p class="text-center text-xs text-gray-400 mt-6">
                <i class="fas fa-store mr-1"></i> RTJ · 06.241.162/0001-06 &nbsp;|&nbsp; RTB · 11.948.022/0001-02
            </p>
        </div>
    </div>

    <script>
        document.querySelector('input[name="usuario"]').focus();
    </script>
</body>
</html>
