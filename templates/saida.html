{% extends "base.html" %}
{% block title %}Saída de Estoque - Inventário QR{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-md p-6 mb-4">
        <h2 class="text-xl font-bold mb-3"><i class="fas fa-arrow-right text-red-600"></i> Saída de Estoque</h2>

        <div class="mb-3">
            <label class="text-xs font-semibold text-gray-500">Loja</label>
            <select id="select_loja" class="w-full sm:w-56 border rounded-lg px-3 py-2 text-sm font-semibold" onchange="trocarLoja(this.value)">
                <option value="">Carregando lojas…</option>
            </select>
        </div>

        <div class="bg-gray-100 rounded-lg p-3 mb-3">
            <div class="flex items-center space-x-2 mb-2">
                <input type="text" id="ean_input" autofocus
                       class="ean-input flex-1 border-2 border-red-300 rounded-lg px-3 py-2 text-gray-900 bg-white"
                       placeholder="EAN ou código de barras...">
                <button onclick="buscarProduto()"
                        class="bg-red-600 text-white px-4 py-2 rounded-lg font-bold">
                    <i class="fas fa-search"></i>
                </button>
                <button type="button" onclick="iniciarCameraAoVivo()"
                        class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-center min-w-[44px]" title="Bipar com câmera">
                    <i class="fas fa-barcode"></i>
                </button>
            </div>
            <div id="produto-info" class="hidden bg-white rounded-lg p-3 border border-gray-200">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <p id="produto-nome" class="font-bold text-lg"></p>
                        <p id="produto-ean" class="text-xs text-gray-500 font-mono"></p>
                    </div>
                    <span id="produto-status" class="text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700">Encontrado</span>
                </div>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <div>
                        <label class="text-xs font-semibold text-gray-500">Quantidade</label>
                        <input type="number" id="qtd_saida" value="1" min="1"
                               class="w-full border rounded-lg px-2 py-1.5 text-center text-lg font-bold">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500">Motivo</label>
                        <select id="motivo_saida" class="w-full border rounded-lg px-2 py-1.5 text-sm">
                            <option value="Transferência">Transferência</option>
                            <option value="Avaria">Avaria</option>
                            <option value="Descarte">Descarte</option>
                            <option value="Vencido">Vencido</option>
                            <option value="Uso interno">Uso interno</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500">Lote</label>
                        <input type="text" id="lote_saida" placeholder="Lote"
                               class="w-full border rounded-lg px-2 py-1.5 text-sm">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500">Validade</label>
                        <input type="date" id="venc_saida"
                               class="w-full border rounded-lg px-2 py-1.5 text-sm">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="text-xs font-semibold text-gray-500">Observação</label>
                    <input type="text" id="obs_saida" placeholder="Observação (opcional)"
                           class="w-full border rounded-lg px-2 py-1.5 text-sm">
                </div>
                <button onclick="registrarSaida()"
                        class="w-full bg-red-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-red-700">
                    <i class="fas fa-check"></i> Registrar Saída
                </button>
            </div>
            <div id="produto-nao-encontrado" class="hidden bg-yellow-50 border border-yellow-200 rounded-lg p-3 text-center">
                <p class="text-yellow-700 font-bold">Produto não encontrado</p>
                <p id="ean-nao-encontrado" class="text-yellow-600 text-sm font-mono"></p>
                <button onclick="cadastrarRapido()" class="mt-2 bg-yellow-600 text-white px-4 py-1 rounded-lg text-sm">
                    <i class="fas fa-plus"></i> Cadastrar rápido
                </button>
            </div>
        </div>

        <div id="result" class="mb-3"></div>
    </div>

    <!-- Últimas saídas -->
    <div class="bg-white rounded-xl shadow-md p-4">
        <h3 class="font-bold text-sm mb-2"><i class="fas fa-history text-gray-500"></i> Últimas Saídas</h3>
        <div id="lista-saidas" class="space-y-1 max-h-60 overflow-y-auto text-sm"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
    let ultimoEan = '';
    let lojaSaida = localStorage.getItem('loja_atual') || 'RTJ';

    async function carregarLojas() {
        const sel = document.getElementById('select_loja');
        try {
            const r = await fetch('/api/lojas', { cache: 'no-store' });
            const lojas = await r.json();
            if (!Array.isArray(lojas) || !lojas.length) return;
            sel.innerHTML = lojas.map(l =>
                `<option value="${l.codigo}">${l.codigo} — ${l.nome}</option>`
            ).join('');
            if (lojas.some(l => l.codigo === lojaSaida)) sel.value = lojaSaida;
            else lojaSaida = sel.value;
        } catch (e) {
            sel.innerHTML = '<option value="RTJ">RTJ</option><option value="RTB">RTB</option>';
        }
    }

    function trocarLoja(codigo) {
        lojaSaida = codigo || 'RTJ';
        localStorage.setItem('loja_atual', lojaSaida);
    }
    window.trocarLoja = trocarLoja;

    document.getElementById('ean_input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            buscarProduto();
        }
    });

    async function buscarProduto() {
        const ean = document.getElementById('ean_input').value.trim();
        if (!ean) return;
        ultimoEan = ean;
        document.getElementById('produto-info').classList.add('hidden');
        document.getElementById('produto-nao-encontrado').classList.add('hidden');
        document.getElementById('result').innerHTML = '<p class="text-blue-600 text-sm"><i class="fas fa-spinner fa-spin"></i> Buscando...</p>';

        const r = await fetch('/api/produtos/' + encodeURIComponent(ean));
        if (!r.ok) {
            document.getElementById('result').innerHTML = '';
            document.getElementById('produto-nao-encontrado').classList.remove('hidden');
            document.getElementById('ean-nao-encontrado').textContent = 'EAN: ' + ean;
            return;
        }
        const p = await r.json();
        document.getElementById('result').innerHTML = '';
        document.getElementById('produto-nome').textContent = p.produto || 'Sem nome';
        document.getElementById('produto-ean').textContent = 'EAN: ' + ean;
        document.getElementById('lote_saida').value = p.lote || '';
        document.getElementById('venc_saida').value = p.data_vencimento || '';
        document.getElementById('qtd_saida').value = 1;
        document.getElementById('produto-info').classList.remove('hidden');
        document.getElementById('ean_input').value = '';
    }
    window.buscarProduto = buscarProduto;

    async function registrarSaida() {
        const ean = ultimoEan;
        const produto = document.getElementById('produto-nome').textContent;
        const quantidade = parseFloat(document.getElementById('qtd_saida').value) || 1;
        const lote = document.getElementById('lote_saida').value.trim();
        const venc = document.getElementById('venc_saida').value;
        const motivo = document.getElementById('motivo_saida').value;
        const obs = document.getElementById('obs_saida').value.trim();

        const r = await fetch('/api/saidas', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ean, produto, quantidade, lote, data_vencimento: venc, motivo, observacao: obs, loja: lojaSaida}),
        });
        const data = await r.json();
        if (data.sucesso) {
            document.getElementById('result').innerHTML =
                `<div class="flash bg-green-100 border border-green-300 rounded-lg p-3 text-center">
                    <i class="fas fa-check-circle text-green-600"></i>
                    <strong>${quantidade}x ${produto}</strong>
                    <span class="text-green-600"> — ${motivo}</span>
                </div>`;
            beep('ok');
            document.getElementById('produto-info').classList.add('hidden');
            document.getElementById('obs_saida').value = '';
carregarLojas();
    carregarSaidas();
        } else {
            mostrarToast(data.msg || 'Erro', 'erro');
        }
        document.getElementById('ean_input').focus();
        setTimeout(() => document.getElementById('result').innerHTML = '', 3000);
    }

    async function cadastrarRapido() {
        const ean = ultimoEan;
        const nome = prompt('Nome do produto:');
        if (!nome) return;
        const r = await fetch('/api/produtos', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ean, produto: nome}),
        });
        if (r.ok) {
            mostrarToast('Produto cadastrado!', 'sucesso');
            buscarProduto();
        } else {
            const data = await r.json();
            mostrarToast(data.msg || 'Erro', 'erro');
        }
    }

    function escanearFoto(event) {
        const file = event.target.files[0];
        if (!file) return;
        const loading = document.getElementById('result');
        loading.innerHTML = '<p class="text-blue-600 text-sm"><i class="fas fa-spinner fa-spin"></i> Processando imagem...</p>';
        const img = new Image();
        img.onload = function() {
            const maxW = 800;
            const scale = Math.min(1, maxW / img.width);
            const c = document.createElement('canvas');
            c.width = img.width * scale;
            c.height = img.height * scale;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0, c.width, c.height);
            c.toBlob(function(blob) {
                const qr = new Html5Qrcode("dummy");
                qr.scanFile(blob, false)
                    .then(result => {
                        loading.innerHTML = '';
                        document.getElementById('ean_input').value = result.trim();
                        buscarProduto();
                    })
                    .catch(() => {
                        loading.innerHTML = '<p class="text-red-500 text-sm">Não foi possível ler</p>';
                    })
                    .finally(() => { qr.clear(); event.target.value = ''; });
            }, 'image/jpeg', 0.8);
        };
        img.src = URL.createObjectURL(file);
    }

    async function carregarSaidas() {
        const r = await fetch('/api/saidas');
        const saidas = await r.json();
        const div = document.getElementById('lista-saidas');
        if (saidas.length === 0) {
            div.innerHTML = '<p class="text-gray-400 text-center">Nenhuma saída registrada</p>';
            return;
        }
        div.innerHTML = saidas.map(s => `
            <div class="flex justify-between items-center p-2 border-b text-xs">
                <div class="flex-1 min-w-0">
                    <span class="font-medium">${s.produto_nome || s.produto || s.ean}</span>
                    <span class="text-gray-400 ml-1">${s.ean}</span>
                    ${s.lote ? `<span class="text-gray-400 ml-1">Lote: ${s.lote}</span>` : ''}
                </div>
                <div class="flex items-center space-x-2 ml-2">
                    ${s.loja ? `<span class="px-1.5 py-0.5 rounded-full bg-indigo-50 text-indigo-600 text-[10px] font-bold">${s.loja}</span>` : ''}
                    <span class="font-bold text-red-600">${s.quantidade}x</span>
                    <span class="text-gray-500">${s.motivo || ''}</span>
                    <span class="text-gray-400">${s.data_saida ? formatarData(s.data_saida.split(' ')[0]) : ''}</span>
                </div>
            </div>
        `).join('');
    }

    carregarSaidas();
</script>
{% endblock %}
