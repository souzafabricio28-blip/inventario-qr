{% extends "base.html" %}
{% block title %}Contagem - Inventário QR{% endblock %}
{% block content %}
<div class="bg-white rounded-xl shadow-md p-6">
    <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
        <h2 class="text-2xl font-bold"><i class="fas fa-chart-bar text-purple-600"></i> Contagem × Omie</h2>
        <div class="flex flex-wrap items-center gap-2">
            <select id="select_sessao" class="border rounded-lg px-3 py-2 text-sm" onchange="carregarContagem()">
                <option value="">Todas as sessões</option>
            </select>
            <label class="flex items-center gap-2 text-sm border rounded-lg px-3 py-2 cursor-pointer">
                <input type="checkbox" id="chk_cruzar" checked onchange="carregarContagem()">
                Cruzar cadastro Omie
            </label>
            <select id="filtro_status" class="border rounded-lg px-3 py-2 text-sm" onchange="renderTabela()">
                <option value="">Todos</option>
                <option value="contado">Só contados</option>
                <option value="pendente">Só pendentes</option>
            </select>
            <button onclick="sincronizarOmie()" class="bg-indigo-600 text-white px-3 py-2 rounded-lg hover:bg-indigo-700 text-sm" title="Sincronizar códigos Omie">
                <i class="fas fa-sync"></i> Omie
            </button>
            <button onclick="exportarExcel()" class="bg-green-600 text-white px-3 py-2 rounded-lg hover:bg-green-700 text-sm">
                <i class="fas fa-file-excel"></i>
            </button>
            <button onclick="exportarPDF()" class="bg-red-600 text-white px-3 py-2 rounded-lg hover:bg-red-700 text-sm">
                <i class="fas fa-file-pdf"></i>
            </button>
        </div>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead>
                <tr class="bg-gray-50 text-left">
                    <th class="px-2 py-2 sortable" onclick="ordenar(0)">Cód. Omie</th>
                    <th class="px-2 py-2 sortable" onclick="ordenar(1)">EAN</th>
                    <th class="px-2 py-2 sortable" onclick="ordenar(2)">Produto</th>
                    <th class="px-2 py-2 sortable" onclick="ordenar(3)">Marca</th>
                    <th class="px-2 py-2 sortable" onclick="ordenar(4)">Lote</th>
                    <th class="px-2 py-2 sortable" onclick="ordenar(5)">Vencimento</th>
                    <th class="px-2 py-2 sortable" onclick="ordenar(6)">Estoque</th>
                    <th class="px-2 py-2 sortable" onclick="ordenar(7)">Contado</th>
                    <th class="px-2 py-2 sortable" onclick="ordenar(8)">Status</th>
                </tr>
            </thead>
            <tbody id="tabela_contagem" class="divide-y"></tbody>
        </table>
    </div>
    <div id="resumo_contagem" class="mt-4 text-sm text-gray-600"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
    let contagens = [];
    let colOrd = 2, ascOrd = true;

    async function carregarSessoes() {
        const r1 = await fetch('/api/sessoes');
        const sessoes = await r1.json();
        const selS = document.getElementById('select_sessao');
        selS.innerHTML = '<option value="">Todas as sessões</option>' +
            sessoes.map(s => `<option value="${s.nome}">${s.nome} (${s.status})</option>`).join('');
    }

    async function carregarContagem() {
        const sessao = document.getElementById('select_sessao').value;
        const cruzar = document.getElementById('chk_cruzar').checked ? '1' : '0';
        const r = await fetch(`/api/contagem?sessao=${encodeURIComponent(sessao)}&cruzar=${cruzar}`);
        const data = await r.json();
        contagens = Array.isArray(data) ? data : [];
        renderTabela();
    }

    function filtradas() {
        const st = document.getElementById('filtro_status').value;
        if (!st) return contagens;
        return contagens.filter(c => c.status === st);
    }

    function renderTabela() {
        const tbody = document.getElementById('tabela_contagem');
        const lista = filtradas();
        if (lista.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-8 text-center text-gray-400">Nenhuma contagem</td></tr>';
            document.getElementById('resumo_contagem').textContent = '';
            return;
        }
        const keys = ['codigo_omie','ean','produto','marca','lote','data_vencimento','quantidade_estoque','total_contado','status'];
        const sorted = [...lista].sort((a,b) => {
            const va = (a[keys[colOrd]]??'').toString().toUpperCase();
            const vb = (b[keys[colOrd]]??'').toString().toUpperCase();
            if (colOrd === 6 || colOrd === 7) {
                return ascOrd ? (Number(a[keys[colOrd]]||0) - Number(b[keys[colOrd]]||0))
                              : (Number(b[keys[colOrd]]||0) - Number(a[keys[colOrd]]||0));
            }
            return ascOrd ? va.localeCompare(vb) : vb.localeCompare(va);
        });
        const totalLeituras = sorted.reduce((acc,c) => acc + (c.total_contado||0), 0);
        const contados = contagens.filter(c => (c.total_contado||0) > 0).length;
        const pendentes = contagens.filter(c => (c.total_contado||0) === 0).length;
        tbody.innerHTML = sorted.map(c => {
            const pend = (c.total_contado||0) === 0;
            return `
            <tr class="${pend ? 'bg-amber-100' : ''}" style="${pend ? '' : 'background:#f8fafc'}">
                <td class="px-2 py-2 font-mono text-xs font-bold" style="color:#312e81">${c.codigo_omie || c.codigo_interno || c.ean}</td>
                <td class="px-2 py-2 font-mono text-xs" style="color:#1e293b">${c.ean}</td>
                <td class="px-2 py-2 font-medium" style="color:#0f172a">${c.produto}</td>
                <td class="px-2 py-2" style="color:#334155">${c.marca || '-'}</td>
                <td class="px-2 py-2 font-mono text-xs" style="color:#1e293b">${c.lote || '-'}</td>
                <td class="px-2 py-2 ${c.data_vencimento && c.data_vencimento < hoje ? 'font-bold' : ''}" style="color:${c.data_vencimento && c.data_vencimento < hoje ? '#b91c1c' : '#1e293b'}">${formatarData(c.data_vencimento)}</td>
                <td class="px-2 py-2 text-center" style="color:#1e293b">${c.quantidade_estoque ?? 0}</td>
                <td class="px-2 py-2 font-bold text-lg text-center" style="color:#312e81">${c.total_contado || 0}</td>
                <td class="px-2 py-2">${pend
                    ? '<span style="color:#78350f;background:#fde68a" class="px-2 py-0.5 rounded text-xs font-semibold">Pendente</span>'
                    : '<span style="color:#14532d;background:#bbf7d0" class="px-2 py-0.5 rounded text-xs font-semibold">Contado</span>'}</td>
            </tr>`;
        }).join('');
        document.getElementById('resumo_contagem').textContent =
            `${contagens.length} no cadastro | ${contados} contados | ${pendentes} pendentes | ${totalLeituras} leituras (filtro: ${sorted.length})`;
        document.querySelectorAll('.sortable').forEach((th,i) => {
            th.classList.toggle('asc', i===colOrd && ascOrd);
            th.classList.toggle('desc', i===colOrd && !ascOrd);
        });
    }

    function ordenar(col) {
        if (colOrd === col) ascOrd = !ascOrd;
        else { colOrd = col; ascOrd = true; }
        renderTabela();
    }

    async function sincronizarOmie() {
        const btn = event.currentTarget;
        btn.disabled = true;
        try {
            const r = await fetch('/api/omie/sincronizar', { method: 'POST' });
            const data = await r.json();
            alert(data.msg || (data.sucesso ? 'OK' : 'Erro'));
            if (data.sucesso) await carregarContagem();
        } catch (e) {
            alert('Falha ao sincronizar Omie');
        } finally {
            btn.disabled = false;
        }
    }

    function exportarExcel() {
        const sessao = document.getElementById('select_sessao').value;
        const cruzar = document.getElementById('chk_cruzar').checked ? '1' : '0';
        window.location.href = `/api/exportar/contagem?sessao=${encodeURIComponent(sessao)}&cruzar=${cruzar}`;
    }

    function exportarPDF() {
        const sessao = document.getElementById('select_sessao').value;
        const cruzar = document.getElementById('chk_cruzar').checked ? '1' : '0';
        window.open(`/api/relatorio?sessao=${encodeURIComponent(sessao)}&cruzar=${cruzar}`, '_blank');
    }

    carregarSessoes();
    carregarContagem();
</script>
{% endblock %}
